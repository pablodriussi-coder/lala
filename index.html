
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lala accesorios: Accesorios para bebés diseñados con amor. Descubre nuestro catálogo de ternura y novedades en nuestro showroom.">
    <link rel="canonical" href="https://www.lalawi.com/" />
    <title>Lala accesorios - Catálogo de Ternura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://esm.sh">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                white: '#f8f7f2',
                beige: '#e8e4d3',
                greige: '#d1cdc1',
                sage: '#b2c0a3',
                red: '#d1202f',
                dark: '#404040'
              }
            }
          }
        }
      }
    </script>
    <script>
      // Attempt to prevent TypeError when libraries try to overwrite window.fetch
      (function() {
        try {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(v) { 
              console.warn('Attempt to overwrite window.fetch ignored.');
            },
            configurable: true // Allow redefinition if needed
          });
        } catch (e) {
          // If it's already read-only, we just ignore it
        }
      })();
    </script>
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f8f7f2;
            color: #404040;
        }
        .lala-gradient {
            background: linear-gradient(135deg, #f8f7f2 0%, #e8e4d3 100%);
        }
        .sidebar-item-active {
            background-color: #e8e4d3;
            border-right: 4px solid #b2c0a3;
            color: #404040;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f8f7f2;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1cdc1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #b2c0a3;
        }
        @media print {
            .print\:hidden { display: none !important; }
            .print\:block { display: block !important; }
            .print\:static { position: static !important; }
            .print\:overflow-visible { overflow: visible !important; }
            .print\:h-auto { height: auto !important; }
            body { background: white !important; }
            @page {
                margin-top: 2cm;
                margin-bottom: 1.5cm;
                margin-left: 2.5cm;
                margin-right: 1.5cm;
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
